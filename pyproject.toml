[project]
name = "agentic-commerce"
version = "0.1.0"
description = "A layered agentic-commerce reference stack: MCP tool access, A2A agent messaging, and AP2 payment mandates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.26.0",
    "httpx>=0.28.1",
    "langchain>=1.3.17",
    "langchain-google-genai>=4.3.6",
    "langchain-mcp-adapters>=0.3.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_commerce"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
