# Fans one OTLP endpoint out to Tempo (traces) and Prometheus (metrics).
# The app previously pointed straight at Tempo, which ingests traces only, so
# every gen_ai.* / commerce.tool.* metric was silently discarded.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep gen_ai.usage.tokens readable as gen_ai_usage_tokens_total
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
